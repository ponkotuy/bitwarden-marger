[package]
name = "bitwarden-merger"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
which = "8.0.6"
zeroize = { version = "1.9.1", features = ["serde", "derive"] }

[profile.release]
lto = "thin"
strip = true
